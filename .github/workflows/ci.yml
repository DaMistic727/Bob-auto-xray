name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck nginx openssl jq
      - name: Python syntax on this interpreter
        # Before the tests: a module that does not compile (for example more than 20
        # nested blocks on Python 3.10) is otherwise reported only as import errors.
        run: python -m compileall -q src tools tests
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Real Nginx proxy integration
        env:
          PYTHONPATH: src
        run: python tools/test_panel_proxy.py
      - name: Pinned 3x-ui client API and GeoData integration
        env:
          PYTHONPATH: src
        run: python tools/test_client_api.py
      - name: Current official menu installer and updater (dynamic revision)
        env:
          PYTHONPATH: src
        run: python tools/test_menu_latest.py
      - name: Syntax and ShellCheck
        run: |
          shellcheck install.sh
          bash -n install.sh
          bash -n vendor/3x-ui/install.sh
          bash -n vendor/3x-ui/x-ui.sh
      - name: Reproducible release build
        run: |
          python tools/release.py --tag "v$(cat VERSION)"
          cp dist/SHA256SUMS /tmp/selfsni-first-build.sha256
          python tools/release.py --tag "v$(cat VERSION)"
          cmp /tmp/selfsni-first-build.sha256 dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          shellcheck dist/install.sh
  certbot-cli:
    # Bob supports Ubuntu 24.04 (certbot 2.9) and 26.04 (certbot 4.0) only.
    name: Packaged Certbot CLI (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the distribution certbot
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends certbot
      - name: Renewal dry-run command line is accepted
        env:
          PYTHONPATH: src
        run: python3 tools/check_certbot_cli.py
