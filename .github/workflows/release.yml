name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    name: Build and publish preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck nginx openssl
      - name: Check sources
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python tools/test_panel_proxy.py
          python tools/test_client_api.py
          python tools/test_menu_latest.py
          python -m compileall -q src tools tests
          bash -n install.sh
          shellcheck install.sh
          bash -n vendor/3x-ui/install.sh
          bash -n vendor/3x-ui/x-ui.sh
      - name: Build pinned assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python tools/release.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO"
          cp dist/SHA256SUMS /tmp/selfsni-first-build.sha256
          python tools/release.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO"
          cmp /tmp/selfsni-first-build.sha256 dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          shellcheck dist/install.sh
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" --verify-tag --prerelease \
            --title "Bob Auto Xray $RELEASE_TAG · Preview" \
            --notes-file dist/release-notes.md \
            dist/selfsni-*.tar.gz dist/install.sh dist/SHA256SUMS
