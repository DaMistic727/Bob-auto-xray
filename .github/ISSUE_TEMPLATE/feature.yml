name: Предложение
description: Предложить улучшение или новый сценарий
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Опишите сценарий пользователя и совместимость с одноразовой установкой.
    validations:
      required: true
