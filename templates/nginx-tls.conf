limit_req_zone $binary_remote_addr zone=selfsni_auth:10m rate=6r/m;
map $http_upgrade $selfsni_connection {
    default upgrade;
    '' close;
}
map $request_method $selfsni_login_ip {
    default '';
    POST $binary_remote_addr;
}
limit_req_zone $selfsni_login_ip zone=selfsni_panel_login:10m rate=6r/m;
server {
    listen unix:/run/selfsni/nginx.sock ssl http2 proxy_protocol;
    server_name @@DOMAIN@@;
    ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from unix:;
    real_ip_header proxy_protocol;
    root /var/www/selfsni;
    access_log off;
    # Nginx error messages can contain the complete secret request URI.
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    absolute_redirect off;
    if ($host != @@DOMAIN@@) { return 404; }
    location = @@PANEL_NO_SLASH@@ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 308 @@PANEL_PATH@@;
    }
    location = @@PANEL_PATH@@login {
        limit_req zone=selfsni_panel_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/selfsni-panel.conf;
    }
    location ^~ @@PANEL_PATH@@ {
        include /etc/nginx/snippets/selfsni-panel.conf;
    }
    location = / { include /etc/nginx/snippets/selfsni-fastcgi.conf; }
    location = /@@AUTH@@ { limit_req zone=selfsni_auth burst=3 nodelay; limit_req_status 429; include /etc/nginx/snippets/selfsni-fastcgi.conf; }
    location = /@@STYLE@@.css { try_files $uri =404; }
    location = /@@ICON@@.svg { try_files $uri =404; }
    location / { return 404; }
}
