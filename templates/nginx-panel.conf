# No URI suffix: preserve the complete webBasePath exactly once.
proxy_pass https://127.0.0.1:@@PANEL_PORT@@;
proxy_http_version 1.1;
proxy_set_header Host @@DOMAIN@@;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append client-supplied forwarding headers.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host @@DOMAIN@@;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded '';
proxy_set_header X-Forwarded-Prefix '';
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $selfsni_connection;
proxy_ssl_server_name on;
proxy_ssl_name @@DOMAIN@@;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_redirect https://@@DOMAIN@@:@@PANEL_PORT@@/ https://@@DOMAIN@@/;
proxy_redirect https://127.0.0.1:@@PANEL_PORT@@/ https://@@DOMAIN@@/;
proxy_connect_timeout 10s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
# Normal upstream mutations are capped at 10 MiB; permit larger DB restores.
client_max_body_size 64m;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cache-Control;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control no-store always;
add_header Strict-Transport-Security "max-age=31536000" always;
